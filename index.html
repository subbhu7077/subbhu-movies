<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SUBBHU MOVIES | Next-Gen Cinematic Neon Streaming</title>
  <style>
    :root {
      --bg: #050508;
      --card-bg: rgba(16, 16, 26, 0.75);
      --glass-border: rgba(255, 255, 255, 0.1);
      --accent-red: #ff1e42;
      --accent-cyan: #00f2fe;
      --accent-purple: #7928ca;
      --accent-gold: #fbbf24;
      --text: #f8fafc;
      --muted: #94a3b8;
      --glow-red: 0 0 25px rgba(255, 30, 66, 0.55);
      --glow-cyan: 0 0 20px rgba(0, 242, 254, 0.45);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 90px;
      position: relative;
    }

    /* --- AFTER EFFECTS CANVAS & AMBIENT ENGINE --- */
    #particle-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      width: 100%;
      height: 100%;
    }

    .ambient-glow-wrap {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.38;
      animation: orbFloat 18s infinite alternate ease-in-out;
    }
    .orb-1 { width: 380px; height: 380px; background: var(--accent-red); top: -100px; right: -80px; }
    .orb-2 { width: 420px; height: 420px; background: var(--accent-purple); top: 40%; left: -120px; animation-duration: 22s; }
    .orb-3 { width: 340px; height: 340px; background: var(--accent-cyan); bottom: 5%; right: -70px; animation-duration: 16s; }

    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -40px) scale(1.1); }
      100% { transform: translate(-20px, 30px) scale(0.95); }
    }

    /* --- CINEMATIC INTRO SPLASH --- */
    #intro-screen {
      position: fixed;
      inset: 0;
      background: #050508;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    .intro-logo {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(135deg, var(--accent-red), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(255, 30, 66, 0.8);
      animation: logoReveal 1.8s ease forwards;
    }
    .intro-loader {
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      margin-top: 18px;
      overflow: hidden;
      position: relative;
    }
    .intro-bar {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-red), var(--accent-cyan));
      box-shadow: 0 0 10px var(--accent-cyan);
      animation: barLoad 1.8s ease-in-out forwards;
    }
    @keyframes logoReveal {
      0% { opacity: 0; transform: scale(0.85); letter-spacing: 1px; filter: blur(8px); }
      50% { opacity: 1; transform: scale(1.05); filter: blur(0px); }
      100% { opacity: 1; transform: scale(1); letter-spacing: 4px; }
    }
    @keyframes barLoad {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    /* --- TOP APP BAR --- */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: rgba(5, 5, 8, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .brand-logo {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--accent-red), #ff7e5f, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(255, 30, 66, 0.6);
    }
    .search-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      transition: all 0.25s ease;
    }
    .search-btn:active {
      transform: scale(0.92);
      border-color: var(--accent-cyan);
      box-shadow: var(--glow-cyan);
    }

    /* --- EXPANDABLE LIVE SEARCH BAR --- */
    .search-box-wrap {
      position: relative;
      z-index: 99;
      padding: 10px 20px 0;
      display: none;
    }
    .search-box-wrap.active { display: block; }
    .search-input-inner {
      position: relative;
      width: 100%;
    }
    .search-input {
      width: 100%;
      background: rgba(20, 20, 32, 0.95);
      border: 1px solid var(--accent-cyan);
      box-shadow: var(--glow-cyan);
      padding: 12px 42px 12px 16px;
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .search-clear {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      cursor: pointer;
      font-size: 1.2rem;
    }

    /* --- HERO SLIDER --- */
    .hero-slider-container {
      position: relative;
      height: 62vh;
      min-height: 440px;
      z-index: 2;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 24px;
    }
    .hero-slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transform: scale(1.08);
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hero-slide.active {
      opacity: 1;
      transform: scale(1);
    }
    .hero-gradient {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(to top, var(--bg) 12%, rgba(5, 5, 8, 0.6) 65%, transparent 100%);
    }
    .hero-content {
      position: relative;
      z-index: 3;
      max-width: 620px;
    }
    .badge-neon {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(255, 30, 66, 0.2);
      border: 1px solid var(--accent-red);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      border-radius: 6px;
      margin-bottom: 8px;
      box-shadow: var(--glow-red);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .hero-title {
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 8px;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.9);
    }
    .hero-meta {
      display: flex;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 12px;
      align-items: center;
    }
    .hero-desc {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.45;
      margin-bottom: 18px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .hero-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-neon {
      background: linear-gradient(135deg, var(--accent-red), #e11d48);
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.92rem;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--glow-red);
      transition: transform 0.2s ease;
    }
    .btn-neon:active { transform: scale(0.95); }
    .btn-glass {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s ease;
    }
    .btn-glass:active { background: rgba(255, 255, 255, 0.16); }

    /* Slider Nav Dots */
    .slider-dots {
      position: absolute;
      bottom: 14px;
      right: 20px;
      z-index: 4;
      display: flex;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transition: all 0.3s ease;
    }
    .dot.active {
      width: 22px;
      border-radius: 6px;
      background: var(--accent-cyan);
      box-shadow: var(--glow-cyan);
    }

    /* --- GENRE PILL SELECTOR --- */
    .pills-container {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 16px 20px;
      scrollbar-width: none;
    }
    .pills-container::-webkit-scrollbar { display: none; }
    .genre-pill {
      flex: 0 0 auto;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .genre-pill.active {
      background: rgba(0, 242, 254, 0.15);
      border-color: var(--accent-cyan);
      color: #fff;
      box-shadow: var(--glow-cyan);
    }

    /* --- SECTIONS & CARDS --- */
    .section {
      position: relative;
      z-index: 2;
      padding: 20px 0 6px 20px;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-right: 20px;
      margin-bottom: 14px;
    }
    .section-title {
      font-size: 1.22rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      position: relative;
    }
    .section-title::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 26px;
      height: 3px;
      background: var(--accent-cyan);
      box-shadow: var(--glow-cyan);
      border-radius: 2px;
    }
    .movie-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 16px;
      scrollbar-width: none;
    }
    .movie-row::-webkit-scrollbar { display: none; }

    /* Cinematic Card */
    .card {
      flex: 0 0 145px;
      background: var(--card-bg);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--glass-border);
      position: relative;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .card:active {
      transform: scale(0.96);
      border-color: var(--accent-cyan);
      box-shadow: var(--glow-cyan);
    }
    .card-thumb-wrap {
      position: relative;
      width: 100%;
      height: 205px;
      overflow: hidden;
    }
    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .card:hover .card-thumb {
      transform: scale(1.06);
    }
    .card-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--accent-cyan);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .card-body {
      padding: 10px;
      background: rgba(12, 12, 18, 0.95);
    }
    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      font-size: 0.72rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      align-items: center;
    }
    .card-fav-btn {
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s ease, transform 0.2s ease;
    }
    .card-fav-btn.active {
      color: var(--accent-red);
      text-shadow: 0 0 10px var(--accent-red);
    }

    /* --- VIDEO PLAYER MODAL --- */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal.active { display: flex; }
    .modal-box {
      background: #0f0f16;
      border: 1px solid var(--accent-red);
      box-shadow: var(--glow-red);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 740px;
      overflow: hidden;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--glass-border);
    }
    .modal-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #fff;
    }
    .modal-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.7rem;
      cursor: pointer;
    }
    .video-viewport {
      position: relative;
      width: 100%;
      background: #000;
    }
    .video-viewport video {
      width: 100%;
      max-height: 60vh;
      display: block;
    }

    /* --- BOTTOM BAR --- */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 66px;
      background: rgba(8, 8, 12, 0.92);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.25s ease;
    }
    .nav-btn.active {
      color: var(--accent-red);
      text-shadow: 0 0 10px rgba(255, 30, 66, 0.8);
    }
    .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }

    /* --- TOAST SYSTEM --- */
    .toast-tray {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      padding: 10px 16px;
      background: rgba(16, 16, 26, 0.95);
      border: 1px solid var(--accent-cyan);
      box-shadow: var(--glow-cyan);
      color: #fff;
      border-radius: 10px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: toastIn 0.3s ease;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- INTRO SCREEN -->
  <div id="intro-screen">
    <div class="intro-logo">SUBBHU MOVIES</div>
    <div class="intro-loader"><div class="intro-bar"></div></div>
  </div>

  <!-- PARTICLE CANVAS & AMBIENT ORBS -->
  <canvas id="particle-canvas"></canvas>
  <div class="ambient-glow-wrap">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>

  <!-- TOP HEADER -->
  <header>
    <a href="index.html" class="brand">
      <span class="brand-logo">SUBBHU MOVIES</span>
    </a>
    <button class="search-btn" onclick="toggleSearch()" aria-label="Search">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </button>
  </header>

  <!-- SEARCH INPUT OVERLAY -->
  <div class="search-box-wrap" id="searchWrap">
    <div class="search-input-inner">
      <input type="text" id="searchInput" class="search-input" placeholder="Search by title, genre..." oninput="handleSearch(this.value)">
      <span class="search-clear" onclick="clearSearch()">&times;</span>
    </div>
  </div>

  <!-- HERO SLIDER COMPONENT -->
  <section class="hero-slider-container" id="heroContainer">
    <div class="hero-gradient"></div>
    <div class="hero-content">
      <span class="badge-neon" id="heroBadge">PREMIERE RESTORATION</span>
      <h1 class="hero-title" id="heroTitle">Tears of Steel</h1>
      <div class="hero-meta">
        <span id="heroYear">2026</span>
        <span>•</span>
        <span id="heroQuality">4K Ultra HD</span>
        <span>•</span>
        <span style="color:var(--accent-cyan);font-weight:700;" id="heroRating">⭐ 8.4</span>
      </div>
      <p class="hero-desc" id="heroDesc">Open-source futuristic Dutch sci-fi epic rendered with cutting-edge visual effects.</p>
      <div class="hero-actions">
        <button class="btn-neon" onclick="playCurrentHero()">
          <svg width="18" height="18" fill="#fff" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          Watch Now
        </button>
        <button class="btn-glass" onclick="toggleHeroFav()">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          Favorite
        </button>
        <button class="btn-glass" onclick="shareMovie()">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
        </button>
      </div>
    </div>
    <div class="slider-dots" id="sliderDots"></div>
  </section>

  <!-- GENRE PILLS -->
  <div class="pills-container">
    <button class="genre-pill active" onclick="filterGenre('All', this)">All</button>
    <button class="genre-pill" onclick="filterGenre('Sci-Fi', this)">Sci-Fi</button>
    <button class="genre-pill" onclick="filterGenre('Fantasy', this)">Fantasy</button>
    <button class="genre-pill" onclick="filterGenre('Animation', this)">Animation</button>
    <button class="genre-pill" onclick="filterGenre('Action', this)">Action</button>
  </div>

  <!-- TRENDING SECTION -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">Trending Restorations</h2>
    </div>
    <div class="movie-row" id="trendingRow"></div>
  </section>

  <!-- POPULAR CINEMA -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">Popular Cinema</h2>
    </div>
    <div class="movie-row" id="popularRow"></div>
  </section>

  <!-- HIGH-DEF PLAYER MODAL -->
  <div class="modal" id="videoModal" onclick="if(event.target === this) closePlayer()">
    <div class="modal-box">
      <div class="modal-head">
        <span class="modal-title" id="modalVideoTitle">Now Playing</span>
        <button class="modal-close" onclick="closePlayer()">&times;</button>
      </div>
      <div class="video-viewport" id="videoWrap"></div>
    </div>
  </div>

  <!-- TOAST ALERTS -->
  <div class="toast-tray" id="toastTray"></div>

  <!-- BOTTOM BAR -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="scrollToTop()">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-btn" onclick="filterGenre('All');toast('Showing full catalog');">
      <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
      <span>Movies</span>
    </button>
    <button class="nav-btn" onclick="showFavoritesModal()">
      <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <span>Favorites</span>
    </button>
    <button class="nav-btn" onclick="toast('User Profile: Subrat Majhi (Active)')">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Profile</span>
    </button>
  </nav>

  <script>
    // --- LEGAL & VERIFIED MOVIE DATABASE ---
    const MOVIES = [
      {
        id: 1,
        title: "Tears of Steel",
        genre: "Sci-Fi",
        year: 2026,
        rating: "8.4",
        quality: "4K UHD",
        desc: "Dystopian Amsterdam sci-fi short film rebuilt with cinematic neon visuals and open-source visual effects.",
        poster: "https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?auto=format&fit=crop&w=400&q=80",
        backdrop: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4"
      },
      {
        id: 2,
        title: "Sintel",
        genre: "Fantasy",
        year: 2025,
        rating: "8.9",
        quality: "UHD HDR",
        desc: "A courageous young warrior journeys through perilous lands searching for her dragon friend.",
        poster: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=400&q=80",
        backdrop: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4"
      },
      {
        id: 3,
        title: "Big Buck Bunny",
        genre: "Animation",
        year: 2025,
        rating: "9.1",
        quality: "HD 60FPS",
        desc: "A giant warm-hearted rabbit devises comical forest retribution against three bullying rodents.",
        poster: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=400&q=80",
        backdrop: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1200&q=80",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
      },
      {
        id: 4,
        title: "Elephants Dream",
        genre: "Sci-Fi",
        year: 2026,
        rating: "9.3",
        quality: "4K HDR",
        desc: "Two men explore the mysterious and infinite mechanical core of a colossal surreal machine.",
        poster: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=400&q=80",
        backdrop: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=1200&q=80",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"
      }
    ];

    // --- FAVORITES STORE (LOCALSTORAGE) ---
    function getFavorites() {
      return JSON.parse(localStorage.getItem('subbhu_favs') || '[]');
    }
    function toggleFavorite(id) {
      let favs = getFavorites();
      if (favs.includes(id)) {
        favs = favs.filter(fId => fId !== id);
        toast("Removed from Favorites");
      } else {
        favs.push(id);
        toast("Saved to your Favorites!");
      }
      localStorage.setItem('subbhu_favs', JSON.stringify(favs));
      renderRows(currentFilteredMovies);
    }

    // --- HERO SLIDER ENGINE ---
    let currentHeroIndex = 0;
    let heroTimer = null;

    function initHeroSlider() {
      const container = document.getElementById('heroContainer');
      const dotsBox = document.getElementById('sliderDots');

      // Create slide backgrounds
      MOVIES.forEach((movie, idx) => {
        const slide = document.createElement('div');
        slide.className = `hero-slide ${idx === 0 ? 'active' : ''}`;
        slide.style.backgroundImage = `url('${movie.backdrop}')`;
        slide.id = `hero-slide-${idx}`;
        container.insertBefore(slide, container.firstChild);

        // Dot
        const dot = document.createElement('div');
        dot.className = `dot ${idx === 0 ? 'active' : ''}`;
        dot.onclick = () => setHeroSlide(idx);
        dotsBox.appendChild(dot);
      });

      startHeroTimer();
    }

    function setHeroSlide(idx) {
      document.querySelectorAll('.hero-slide').forEach((s, i) => {
        s.classList.toggle('active', i === idx);
      });
      document.querySelectorAll('.dot').forEach((d, i) => {
        d.classList.toggle('active', i === idx);
      });

      const m = MOVIES[idx];
      document.getElementById('heroTitle').textContent = m.title;
      document.getElementById('heroYear').textContent = m.year;
      document.getElementById('heroQuality').textContent = m.quality;
      document.getElementById('heroRating').textContent = `⭐ ${m.rating}`;
      document.getElementById('heroDesc').textContent = m.desc;
      currentHeroIndex = idx;
    }

    function startHeroTimer() {
      clearInterval(heroTimer);
      heroTimer = setInterval(() => {
        let next = (currentHeroIndex + 1) % MOVIES.length;
        setHeroSlide(next);
      }, 5500);
    }

    function playCurrentHero() {
      playMovie(MOVIES[currentHeroIndex].id);
    }

    function toggleHeroFav() {
      toggleFavorite(MOVIES[currentHeroIndex].id);
    }

    // --- RENDER MOVIE CARDS ---
    let currentFilteredMovies = [...MOVIES];

    function renderRows(list) {
      const trending = document.getElementById('trendingRow');
      const popular = document.getElementById('popularRow');
      const favs = getFavorites();

      function buildCard(m) {
        const isFav = favs.includes(m.id);
        return `
          <div class="card" onclick="playMovie(${m.id})">
            <div class="card-thumb-wrap">
              <img class="card-thumb" src="${m.poster}" alt="${m.title}" loading="lazy">
              <span class="card-badge">${m.quality}</span>
            </div>
            <div class="card-body">
              <div class="card-title">${m.title}</div>
              <div class="card-meta">
                <span>${m.year}</span>
                <span style="color:var(--accent-cyan);font-weight:700;">⭐ ${m.rating}</span>
                <span class="card-fav-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFavorite(${m.id})">
                  ♥
                </span>
              </div>
            </div>
          </div>
        `;
      }

      trending.innerHTML = list.map(m => buildCard(m)).join('');
      popular.innerHTML = [...list].reverse().map(m => buildCard(m)).join('');
    }

    // --- FILTER BY GENRE ---
    function filterGenre(genre, btn) {
      if (btn) {
        document.querySelectorAll('.genre-pill').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
      }
      if (genre === 'All') {
        currentFilteredMovies = [...MOVIES];
      } else {
        currentFilteredMovies = MOVIES.filter(m => m.genre.toLowerCase() === genre.toLowerCase());
      }
      renderRows(currentFilteredMovies);
      toast(`Filtered: ${genre}`);
    }

    // --- LIVE SEARCH SYSTEM ---
    function toggleSearch() {
      const wrap = document.getElementById('searchWrap');
      wrap.classList.toggle('active');
      if (wrap.classList.contains('active')) {
        document.getElementById('searchInput').focus();
      }
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      currentFilteredMovies = [...MOVIES];
      renderRows(currentFilteredMovies);
    }

    function handleSearch(val) {
      const q = val.trim().toLowerCase();
      if (!q) {
        currentFilteredMovies = [...MOVIES];
      } else {
        currentFilteredMovies = MOVIES.filter(m => 
          m.title.toLowerCase().includes(q) || 
          m.genre.toLowerCase().includes(q) || 
          m.year.toString().includes(q)
        );
      }
      renderRows(currentFilteredMovies);
    }

    // --- VIDEO PLAYER MODAL CONTROLS ---
    function playMovie(id) {
      const m = MOVIES.find(item => item.id === id);
      if (!m) return;

      document.getElementById('modalVideoTitle').textContent = `${m.title} (${m.year}) - ${m.quality}`;
      document.getElementById('videoWrap').innerHTML = `
        <video controls autoplay playsinline preload="auto">
          <source src="${m.videoUrl}" type="video/mp4">
          Playback error: browser unsupported.
        </video>
      `;
      document.getElementById('videoModal').classList.add('active');
      toast(`Now Streaming: ${m.title}`);
    }

    function closePlayer() {
      const wrap = document.getElementById('videoWrap');
      const v = wrap.querySelector('video');
      if (v) { v.pause(); v.src = ''; }
      wrap.innerHTML = '';
      document.getElementById('videoModal').classList.remove('active');
    }

    // --- SHARE FUNCTIONALITY ---
    function shareMovie() {
      const m = MOVIES[currentHeroIndex];
      if (navigator.share) {
        navigator.share({
          title: `Watch ${m.title} on SUBBHU MOVIES`,
          text: `Check out ${m.title} in 4K HDR!`,
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        toast("Link copied to clipboard!");
      }
    }

    // --- FAVORITES LIST MODAL POPUP ---
    function showFavoritesModal() {
      const favs = getFavorites();
      const favMovies = MOVIES.filter(m => favs.includes(m.id));
      if (favMovies.length === 0) {
        toast("Your Favorites list is empty!");
      } else {
        currentFilteredMovies = favMovies;
        renderRows(currentFilteredMovies);
        toast(`Loaded ${favMovies.length} saved movies`);
      }
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- REUSABLE TOAST ALERTS ---
    function toast(text) {
      const tray = document.getElementById('toastTray');
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = `<span>⚡</span><span>${text}</span>`;
      tray.appendChild(t);
      setTimeout(() => t.remove(), 2600);
    }

    // --- AFTER EFFECTS FLOATING PARTICLES CANVAS ---
    function initCanvasParticles() {
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      const particles = Array.from({ length: 28 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 2 + 0.8,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5,
        color: Math.random() > 0.5 ? 'rgba(0, 242, 254, ' : 'rgba(255, 30, 66, '
      }));

      function draw() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = w;
          if (p.x > w) p.x = 0;
          if (p.y < 0) p.y = h;
          if (p.y > h) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color + '0.45)';
          ctx.shadowBlur = 10;
          ctx.shadowColor = p.color + '0.8)';
          ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      draw();
    }

    // --- APP BOOTSTRAP ---
    window.addEventListener('DOMContentLoaded', () => {
      initHeroSlider();
      renderRows(MOVIES);
      initCanvasParticles();

      // Dismiss cinematic intro splash
      setTimeout(() => {
        const intro = document.getElementById('intro-screen');
        intro.style.opacity = '0';
        setTimeout(() => intro.style.display = 'none', 800);
      }, 1800);
    });
  </script>
</body>
