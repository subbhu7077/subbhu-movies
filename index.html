<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SUBBHU MOVIES | Cinematic Neon Streaming</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #07070b;
      --card-bg: rgba(18, 18, 28, 0.75);
      --accent-red: #ff1e42;
      --accent-cyan: #00f2fe;
      --accent-purple: #8b5cf6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.12);
      --neon-glow: 0 0 25px rgba(255, 30, 66, 0.5);
      --cyan-glow: 0 0 20px rgba(0, 242, 254, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 85px;
      position: relative;
    }

    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      animation: float 14s infinite alternate ease-in-out;
    }
    .orb-1 { width: 350px; height: 350px; background: var(--accent-red); top: -80px; right: -80px; }
    .orb-2 { width: 320px; height: 320px; background: var(--accent-purple); top: 35%; left: -90px; }
    .orb-3 { width: 280px; height: 280px; background: var(--accent-cyan); bottom: 10%; right: -50px; }

    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-30px) scale(1.08); }
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: rgba(7, 7, 11, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--accent-red), #ff7e5f, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(255, 30, 66, 0.5);
    }

    .hero {
      position: relative;
      height: 60vh;
      min-height: 420px;
      display: flex;
      align-items: flex-end;
      padding: 24px;
      z-index: 1;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--bg) 10%, rgba(7, 7, 11, 0.55) 60%, transparent 100%);
    }
    .hero-details {
      position: relative;
      z-index: 2;
      max-width: 600px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(255, 30, 66, 0.2);
      border: 1px solid var(--accent-red);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      border-radius: 6px;
      margin-bottom: 8px;
      box-shadow: 0 0 12px rgba(255, 30, 66, 0.4);
    }
    .hero-title {
      font-size: 2.1rem;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 8px;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.9);
    }
    .hero-meta {
      display: flex;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 12px;
      align-items: center;
    }
    .hero-desc {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.4;
      margin-bottom: 18px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .hero-actions { display: flex; gap: 12px; }
    .btn-play {
      background: linear-gradient(135deg, var(--accent-red), #e11d48);
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.92rem;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--neon-glow);
    }
    .btn-fav {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .section {
      position: relative;
      z-index: 1;
      padding: 26px 0 6px 20px;
    }
    .section-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 14px;
      position: relative;
    }
    .section-title::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 28px;
      height: 3px;
      background: var(--accent-cyan);
      box-shadow: var(--cyan-glow);
      border-radius: 2px;
    }
    .movie-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 14px;
      scrollbar-width: none;
    }
    .movie-row::-webkit-scrollbar { display: none; }

    .card {
      flex: 0 0 145px;
      background: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.25s ease;
    }
    .card:active {
      transform: scale(0.96);
      border-color: var(--accent-cyan);
    }
    .card-img-wrap {
      position: relative;
      width: 100%;
      height: 205px;
    }
    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--accent-cyan);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .card-body {
      padding: 10px;
      background: rgba(14, 14, 22, 0.95);
    }
    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(18px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal.active { display: flex; }
    .modal-box {
      background: #11111a;
      border: 1px solid var(--accent-red);
      box-shadow: var(--neon-glow);
      border-radius: 18px;
      width: 100%;
      max-width: 720px;
      overflow: hidden;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }
    .player-wrap {
      position: relative;
      width: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .player-wrap video {
      width: 100%;
      max-height: 65vh;
      display: block;
      outline: none;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: rgba(9, 9, 14, 0.92);
      backdrop-filter: blur(18px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .nav-item.active {
      color: var(--accent-red);
      text-shadow: 0 0 10px rgba(255, 30, 66, 0.7);
    }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

    .toast-box {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      padding: 10px 16px;
      background: rgba(18, 18, 28, 0.95);
      border: 1px solid var(--accent-cyan);
      box-shadow: var(--cyan-glow);
      color: #fff;
      border-radius: 10px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <header>
    <div class="logo">SUBBHU MOVIES</div>
    <div onclick="toast('Search catalog active')" style="cursor:pointer;">
      <svg width="22" height="22" fill="#fff" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </div>
  </header>

  <section class="hero">
    <div class="hero-bg" style="background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80');"></div>
    <div class="hero-overlay"></div>
    <div class="hero-details">
      <span class="badge">ULTRA NEON 4K</span>
      <h1 class="hero-title">Tears of Steel</h1>
      <div class="hero-meta">
        <span>2026</span>
        <span>•</span>
        <span>Sci-Fi Restored</span>
        <span>•</span>
        <span style="color:var(--accent-cyan);font-weight:700;">⭐ 8.4 Rating</span>
      </div>
      <p class="hero-desc">Dystopian Amsterdam sci-fi short film rebuilt with cinematic neon visuals and open-source visual effects.</p>
      <div class="hero-actions">
        <button class="btn-play" onclick="playMovie(1)">
          <svg width="18" height="18" fill="#fff" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          Watch Now
        </button>
        <button class="btn-fav" onclick="toast('Added to your Favorites!')">+ Favorites</button>
      </div>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">Trending Restorations</h2>
    <div class="movie-row" id="trending-row"></div>
  </section>

  <section class="section">
    <h2 class="section-title">Popular Cinema</h2>
    <div class="movie-row" id="popular-row"></div>
  </section>

  <!-- Native HTML5 Video Player Modal -->
  <div class="modal" id="playerModal" onclick="if(event.target === this) closePlayer()">
    <div class="modal-box">
      <div class="modal-head">
        <span id="playerTitle" style="font-weight:700;font-size:0.95rem;">Playing Video</span>
        <button onclick="closePlayer()" style="background:none;border:none;color:#fff;font-size:1.6rem;cursor:pointer;">&times;</button>
      </div>
      <div class="player-wrap" id="videoWrap"></div>
    </div>
  </div>

  <div class="toast-box" id="toastBox"></div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </a>
    <a href="#" class="nav-item" onclick="toast('Movies catalog')">
      <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
      <span>Movies</span>
    </a>
    <a href="#" class="nav-item" onclick="toast('Favorites screen')">
      <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <span>Favorites</span>
    </a>
    <a href="#" class="nav-item" onclick="toast('Profile settings')">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <script>
    // Direct Legal MP4 Video Streams (No YouTube Iframe restrictions)
    const MOVIES = [
      {
        id: 1,
        title: "Tears of Steel",
        year: 2026,
        rating: "8.4",
        quality: "4K",
        poster: "https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?auto=format&fit=crop&w=400&q=80",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4"
      },
      {
        id: 2,
        title: "Sintel",
        year: 2025,
        rating: "8.9",
        quality: "UHD",
        poster: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=400&q=80",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4"
      },
      {
        id: 3,
        title: "Big Buck Bunny",
        year: 2025,
        rating: "9.1",
        quality: "HD",
        poster: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=400&q=80",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
      },
      {
        id: 4,
        title: "Elephants Dream",
        year: 2026,
        rating: "9.3",
        quality: "4K HDR",
        poster: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=400&q=80",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"
      }
    ];

    function render() {
      const trending = document.getElementById('trending-row');
      const popular = document.getElementById('popular-row');
      
      const cards = MOVIES.map(m => `
        <div class="card" onclick="playMovie(${m.id})">
          <div class="card-img-wrap">
            <img class="card-img" src="${m.poster}" alt="${m.title}" loading="lazy">
            <span class="card-tag">${m.quality}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${m.title}</div>
            <div class="card-meta">
              <span>${m.year}</span>
              <span style="color:var(--accent-cyan);">⭐ ${m.rating}</span>
            </div>
          </div>
        </div>
      `).join('');

      trending.innerHTML = cards;
      popular.innerHTML = [...MOVIES].reverse().map(m => `
        <div class="card" onclick="playMovie(${m.id})">
          <div class="card-img-wrap">
            <img class="card-img" src="${m.poster}" alt="${m.title}" loading="lazy">
            <span class="card-tag">${m.quality}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${m.title}</div>
            <div class="card-meta">
              <span>${m.year}</span>
              <span style="color:var(--accent-cyan);">⭐ ${m.rating}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function playMovie(id) {
      const m = MOVIES.find(item => item.id === id);
      if(!m) return;
      document.getElementById('playerTitle').textContent = `${m.title} (${m.year}) - ${m.quality}`;
      document.getElementById('videoWrap').innerHTML = `
        <video controls autoplay playsinline preload="auto">
          <source src="${m.videoUrl}" type="video/mp4">
          Your browser does not support video playback.
        </video>
      `;
      document.getElementById('playerModal').classList.add('active');
      toast('Streaming: ' + m.title);
    }

    function closePlayer() {
      const videoWrap = document.getElementById('videoWrap');
      const video = videoWrap.querySelector('video');
      if (video) {
        video.pause();
        video.src = "";
      }
      videoWrap.innerHTML = '';
      document.getElementById('playerModal').classList.remove('active');
    }

    function toast(msg) {
      const box = document.getElementById('toastBox');
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      box.appendChild(t);
      setTimeout(() => t.remove(), 2800);
    }

    window.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
